# CI (section 6): every pull request to main and every push to dev.
# Job names are the required status checks in the main ruleset: keep them stable.
# Nothing here publishes anything; cd.yml does that, after its own tests pass.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

# Least privilege: read the code, nothing else.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  KUBECONFORM_VERSION: v0.6.7
  # The same scanner version we run locally, so local and CI results agree.
  TRIVY_IMAGE: aquasec/trivy:0.58.1
  KIND_VERSION: v0.33.0
  KUSTOMIZE_VERSION: v5.8.3

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            indexer/requirements*.txt
      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - name: ruff
        run: ruff check api indexer eval corpus
      - name: mypy (api)
        working-directory: api
        run: mypy app
      - name: mypy (indexer)
        working-directory: indexer
        run: mypy pipeline

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            indexer/requirements*.txt
      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      # Stub retriever and stub provider only: no network, no model, no cluster.
      - name: pytest (api, coverage gate 60 %)
        working-directory: api
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=60
      - name: pytest (indexer)
        working-directory: indexer
        run: pytest -q
      - name: pytest (eval)
        run: pytest eval/tests -q

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      # A broken manifest fails here in seconds instead of on the cluster.
      - name: Validate every overlay
        run: |
          for overlay in k8s/overlays/*/; do
            echo "::group::${overlay}"
            kubectl kustomize "${overlay}" | kubeconform -strict -summary -
            echo "::endgroup::"
          done

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Built, never pushed: a pull request must not publish anything.
      - name: Build the api image
        run: docker build -t rahbar-api:ci api
      - name: Build the ui image
        run: docker build -t rahbar-ui:ci ui
      - name: Build the indexer image (repository root context)
        run: docker build -t rahbar-indexer:ci -f indexer/Dockerfile .

  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the images to scan
        run: |
          docker build -t rahbar-api:ci api
          docker build -t rahbar-ui:ci ui
          docker build -t rahbar-indexer:ci -f indexer/Dockerfile .
      # Fail on HIGH or CRITICAL findings that have a fix available (section 6).
      - name: Trivy
        run: |
          status=0
          for image in rahbar-api:ci rahbar-ui:ci rahbar-indexer:ci; do
            echo "::group::${image}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY_IMAGE}" \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --no-progress "${image}" || status=1
            echo "::endgroup::"
          done
          exit "${status}"

  # The section 5.4 gate on a real stack: a kind cluster, the manifests, the indexer Job on
  # the fixture corpus (eval/fixtures), real retrieval with nomic-embed-text from an
  # in-cluster Ollama, then eval/run_eval.py against the committed fixture baseline. It fails
  # when recall@5 drops more than 5 points, a must-abstain question is answered, or
  # citation validity falls below 95 %. The LLM is the stub: the gate measures retrieval,
  # abstention and citations, not the model's prose.
  e2e-eval:
    needs: [test, manifests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the eval runner's dependencies
        run: pip install httpx==0.28.1 pyyaml==6.0.2
      # The runner image already has a root-owned kind in /usr/local/bin.
      - name: Install kind and kustomize
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -sSfLo "$bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "$bin/kind"
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$bin" kustomize
          echo "$bin" >> "$GITHUB_PATH"
      - name: Build the images
        run: |
          docker build -t "local/rahbar-api:${GITHUB_SHA}" api
          docker build -t "local/rahbar-ui:${GITHUB_SHA}" ui
          docker build -t "local/rahbar-indexer:${GITHUB_SHA}" -f indexer/Dockerfile .
      - name: Deploy the ci overlay to kind
        env:
          OVERLAY: ci
          KEEP_CLUSTER: "1"
        run: bash scripts/cd/deploy-kind.sh local "${GITHUB_SHA}"
      - name: Evaluate and enforce the gate
        run: |
          python eval/run_eval.py --api http://localhost --host rahbar.local \
            --golden eval/fixtures/golden.fixture.yaml \
            --baseline eval/fixtures/baseline.fixture.json \
            --out "${RUNNER_TEMP}/results.fixture.json"
      - name: Show the results
        if: always()
        run: cat "${RUNNER_TEMP}/results.fixture.json" 2>/dev/null || echo "no results written"
