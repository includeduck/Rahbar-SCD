# The Part B suite against the candidate (Assignment 03, C1, C2 and F3): retrieval on the
# candidate's collection, answers from the api-candidate Service, then the release gate
# against /results/baseline.json (the last live run that passed, written by k8s/eval-job.yaml).
# The Job fails when the gate fails; a failed candidate is never rolled out.
#
#   kubectl -n rahbar delete job eval-candidate --ignore-not-found
#   kubectl apply -f k8s/candidate/eval-candidate-job.yaml
#   kubectl -n rahbar logs -f job/eval-candidate
apiVersion: batch/v1
kind: Job
metadata:
  name: eval-candidate
  namespace: rahbar
  labels:
    app.kubernetes.io/name: eval
    app.kubernetes.io/part-of: rahbar
    rahbar/track: candidate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eval
        app.kubernetes.io/part-of: rahbar
        rahbar/track: candidate
    spec:
      serviceAccountName: eval
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eval
          image: rahbar-eval:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "eval.suite"]
          args: ["--runs", "2", "--seed", "42"]
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - {name: EVAL_API, value: "http://api-candidate:8000"}
            - {name: EVAL_COLLECTION, value: "rahbar-nomic-embed-text-c250o50"}
            - {name: EVAL_LABEL, value: "candidate-c250o50"}
            - {name: EVAL_RESULTS_DIR, value: "/results"}
            - {name: EVAL_GATE, value: "1"}
            - {name: GATE_CONFIG, value: "/config/gate.yaml"}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: results, mountPath: /results}
            - {name: gate, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: eval-results
        - name: gate
          configMap:
            name: rahbar-gate
        - name: tmp
          emptyDir: {}
