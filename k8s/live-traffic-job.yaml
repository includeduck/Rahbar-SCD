# The live query log (Assignment 03, E1): plays eval/live_queries.jsonl (42 queries, 28 in the
# golden set's domain and 14 about campus IT, which neither the corpus nor the tests cover)
# against the live api, as users would: through the Service, no cache bypass, request ids
# live-l01 ... live-l42. Each request leaves a trace on the traces volume; Job coverage-check
# (k8s/coverage-job.yaml) reads them back from there.
#
#   kubectl -n rahbar delete job live-traffic --ignore-not-found
#   kubectl apply -f k8s/live-traffic-job.yaml
#   kubectl -n rahbar logs -f job/live-traffic        # one line per query; ~15 minutes on CPU
apiVersion: batch/v1
kind: Job
metadata:
  name: live-traffic
  namespace: rahbar
  labels:
    app.kubernetes.io/name: eval
    app.kubernetes.io/part-of: rahbar
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 5400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eval
        app.kubernetes.io/part-of: rahbar
    spec:
      serviceAccountName: eval
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic
          image: rahbar-eval:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "eval.live_traffic"]
          env:
            - {name: EVAL_API, value: "http://api:8000"}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
