# The api: reads the index on every question and never writes it (section 4.2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rahbar
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: rahbar
spec:
  # Three readers. The HPA (phase 4) takes over the count between 3 and 8.
  replicas: 3
  # One extra pod at a time, never one fewer: a rollout keeps three serving (section 4.6).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: rahbar
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      # We find Services by DNS name. Service-link variables (CHROMA_PORT=tcp://...) would
      # only shadow our ConfigMap keys of the same name.
      enableServiceLinks: false
      # preStop (10 s) plus time for in-flight answers, which can wait on the LLM.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: rahbar-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: rahbar-config
            # LLM_API_KEY for the hosted provider. Created with `make secret`, never from a
            # committed file; optional so the stub and Ollama modes start without it.
            - secretRef:
                name: rahbar-secret
                optional: true
          # The three probes from section 4.3, with their exact values.
          startupProbe:
            httpGet: { path: /healthz, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          # Readiness drops the pod from the Service first; the sleep lets the endpoint
          # removal reach the Ingress before uvicorn stops accepting connections.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          # Measured 24 Nov 2026 (eval/results/part-f): idle and under the suite 5-9m CPU, 47-52
          # MiB working set; a 12-client burst (2.5 answers/s) 64m per pod, 54 MiB, memory.peak
          # 76 MiB. The model runs outside the pod, so the api waits more than it computes.
          # requests.cpu is the HPA's denominator: at its 70% target, 100m scales out above
          # about 70m per pod, which the burst reached (66%). Memory: the peak plus a quarter;
          # the limit leaves room for long prompts and answers.
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
  # The api cannot be ready before the index exists, and on a fresh cluster the indexer Job
  # takes about 9 minutes (578.5 s in WSL on 11 Nov). Kubernetes' default 600 s deadline then
  # marks the first rollout as failed although the pods turn ready seconds later; 20 minutes
  # leaves room. Kept at the end of the spec so the line numbers cited in the docs stay put.
  progressDeadlineSeconds: 1200
