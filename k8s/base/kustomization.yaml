apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rahbar

# secret.placeholder.yaml is deliberately absent: the real Secret comes from `make secret`.
resources:
  - namespace.yaml
  - configmap.yaml
  - serviceaccounts.yaml
  - chroma-statefulset.yaml
  - redis.yaml
  - api.yaml
  - ui.yaml
  - services.yaml
  - ingress.yaml
  - indexer-job.yaml
  - reindex-cronjob.yaml
