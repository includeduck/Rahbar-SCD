apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rahbar

# secret.placeholder.yaml is deliberately absent: the real Secret comes from `make secret`.
resources:
  - namespace.yaml
  - configmap.yaml
  - serviceaccounts.yaml
  - chroma-statefulset.yaml
  - redis.yaml
  - api.yaml
  - ui.yaml
  - services.yaml
  - ingress.yaml
  - corpus-pvc.yaml
  - indexer-job.yaml
  - reindex-cronjob.yaml
  - hpa.yaml
  - networkpolicy.yaml
  - traces.yaml                 # Assignment 03: the query traces volume
  - eval.yaml                   # Assignment 03: what the eval Job needs (k8s/eval-job.yaml)

patches:
  - path: api-traces-patch.yaml
