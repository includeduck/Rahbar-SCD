# One host: / to the ui, /api to the api with the prefix kept (the api's routes start with
# /api). Needs `minikube addons enable ingress` (make cluster does this).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahbar
  namespace: rahbar
  labels:
    app.kubernetes.io/part-of: rahbar
  annotations:
    # Generation on a laptop CPU can take longer than ingress-nginx's 60 s default. The api
    # allows LLM_TIMEOUT_SECONDS (120) per attempt and up to two attempts, so 300 s here.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: rahbar.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  name: http
