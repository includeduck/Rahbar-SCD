# The indexer: the only writer to Chroma. It runs once and exits (section 4.2, ADR 0001).
# Re-index without a redeploy:
#   kubectl create job --from=cronjob/reindex manual-reindex-1 -n rahbar
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: rahbar
spec:
  # Retries cover a Chroma or a website that is not reachable yet when the Job starts.
  backoffLimit: 4
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: indexer
        app.kubernetes.io/part-of: rahbar
    spec:
      restartPolicy: OnFailure
      serviceAccountName: indexer
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The corpus volume must be writable by uid 10001.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # 1. Download the documents into the corpus volume (each one only once), then check
        #    every file against the SHA-256 in the committed corpus/MANIFEST.md.
        - name: fetch-corpus
          image: rahbar-indexer
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - python /app/corpus/fetch.py --out /corpus && python /app/corpus/fetch.py --out /corpus --verify
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: corpus
              mountPath: /corpus
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        # 2. On a fresh cluster Chroma can take minutes (image pull, PVC binding). Wait for
        #    its heartbeat here instead of burning the Job's backoffLimit on connection errors.
        - name: wait-for-chroma
          image: rahbar-indexer
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import os, time, httpx
              url = f"http://{os.environ['CHROMA_HOST']}:{os.environ['CHROMA_PORT']}/api/v2/heartbeat"
              for attempt in range(120):
                  try:
                      httpx.get(url, timeout=3).raise_for_status()
                      print("chroma is up", flush=True)
                      break
                  except Exception as exc:
                      print(f"waiting for chroma ({attempt}): {exc}", flush=True)
                      time.sleep(5)
              else:
                  raise SystemExit("chroma did not come up in 10 minutes")
          envFrom:
            - configMapRef:
                name: rahbar-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: indexer
          image: rahbar-indexer
          imagePullPolicy: IfNotPresent
          # extract → clean → chunk → embed → store. The CronJob runs the same image and
          # arguments.
          args: ["python", "-m", "pipeline.run"]
          envFrom:
            - configMapRef:
                name: rahbar-config
          # Sized from `kubectl top` during real run (docs/evidence/kubectl-top-indexer.txt):
          # peak memory 712 MiB during OCR, peak CPU 1405m. Limit 2Gi gives 65% margin (no OOM 137).
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: corpus
              mountPath: /corpus
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: corpus
          persistentVolumeClaim:
            claimName: corpus-data
        - name: tmp
          emptyDir: {}
