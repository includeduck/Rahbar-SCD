# Documents the Secret's shape only. NOT listed in kustomization.yaml: applying it would
# overwrite the real Secret. Create the real one from the command line (section 4.7):
#   export LLM_API_KEY=...   then   make secret
# which runs:
#   kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="$LLM_API_KEY"
# Base64 in a Secret is encoding, not encryption: a real value never goes in a file.
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
